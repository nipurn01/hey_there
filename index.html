<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey There 👀</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff1f5, #f7f0ff);
    color: #29202a;
}

.card {
    width: 90%;
    max-width: 420px;
    padding: 42px 28px;
    text-align: center;
    background: white;
    border-radius: 28px;
    box-shadow: 0 15px 50px rgba(80,40,70,0.15);
}

.emoji {
    font-size: 55px;
    margin-bottom: 12px;
}

h1 {
    font-size: 28px;
    margin: 8px 0 14px;
}

p {
    font-size: 17px;
    line-height: 1.55;
    color: #665d65;
}

button {
    border: none;
    border-radius: 999px;
    padding: 15px 30px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
    background: #ff5c8a;
    color: white;
    box-shadow: 0 8px 20px rgba(255,92,138,0.3);
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="card">

    <section id="page1">
        <div class="emoji">👀</div>

        <h1>Hey, you!</h1>

        <p>
            I have a tiny question for you...
        </p>

        <button onclick="showPage(2)">
            Tap me ✨
        </button>
    </section>


    <section id="page2" class="hidden">

        <div class="emoji">🌹</div>

        <h1>
            Would you like to go for coffee with me?
        </h1>

        <p>
            No pressure... just coffee,
            good conversation, and maybe a little chemistry. ☕
        </p>

        <button onclick="showPage(3)">
            YES ☕❤️
        </button>

    </section>


    <section id="page3" class="hidden">

        <div class="emoji">🥹☕</div>

        <h1>
            It's a date then!
        </h1>

        <p>
            Okay, now you officially owe me a coffee. 😌
        </p>

    </section>

</div>


<script>

function showPage(pageNumber) {

    document
        .querySelectorAll(".card section")
        .forEach(section => {
            section.classList.add("hidden");
        });

    document
        .getElementById("page" + pageNumber)
        .classList.remove("hidden");
}

</script>

</body>
</html>
